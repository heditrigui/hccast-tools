[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hccast-tools"
version = "0.1.0"
description = "Find out what your cheap \"Android\" projector really is, and control it from your PC: info, security audit, DLNA casting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hedi Trigui" }]
keywords = ["hccast", "hichip", "projector", "dlna", "upnp", "miracast", "magcubic", "hy300"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
web = ["yt-dlp"]

[project.scripts]
hccast = "hccast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hccast = ["gui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
